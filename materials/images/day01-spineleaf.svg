<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      text { font-family: "Noto Sans CJK JP", sans-serif; fill: #1f2937; }
      .title { font-size: 26px; font-weight: 700; }
      .sub { font-size: 15px; fill: #6b7280; }
      .devname { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .rowlabel { font-size: 15px; font-weight: 700; fill: #6b7280; }
      .hop { font-size: 15px; font-weight: 700; fill: #b45309; }
      .note { font-size: 13px; fill: #4b5563; text-anchor: middle; }
      .legend { font-size: 13px; fill: #374151; }
      .link { stroke: #94a3b8; stroke-width: 3; }
      .path { stroke: #ff9200; stroke-width: 6; stroke-linecap: round; }
    </style>
    <g id="pc">
      <rect x="-26" y="-24" width="52" height="36" rx="4" fill="#475569"/>
      <rect x="-21" y="-19" width="42" height="26" rx="2" fill="#bfdbfe"/>
      <rect x="-8" y="12" width="16" height="6" fill="#475569"/>
      <rect x="-18" y="18" width="36" height="5" rx="2" fill="#475569"/>
    </g>
    <g id="leafsw">
      <rect x="-55" y="-30" width="110" height="60" rx="10" fill="#0e9aa7"/>
      <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
        <line x1="-32" y1="-8" x2="20" y2="-8"/>
        <line x1="-22" y1="8" x2="32" y2="8"/>
      </g>
      <g fill="#ffffff">
        <path d="M 20 -14 L 34 -8 L 20 -2 Z"/>
        <path d="M -22 2 L -36 8 L -22 14 Z"/>
      </g>
    </g>
    <g id="spinesw">
      <rect x="-55" y="-30" width="110" height="60" rx="10" fill="#2779ca"/>
      <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
        <line x1="-32" y1="-8" x2="20" y2="-8"/>
        <line x1="-22" y1="8" x2="32" y2="8"/>
      </g>
      <g fill="#ffffff">
        <path d="M 20 -14 L 34 -8 L 20 -2 Z"/>
        <path d="M -22 2 L -36 8 L -22 14 Z"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>

  <text class="title" x="40" y="52">Spine-Leaf 構成（Spine 2 台 × Leaf 3 台の例）</text>
  <text class="sub" x="40" y="80">すべての Leaf がすべての Spine と接続する「フルメッシュ」。異なる Leaf 配下のサーバ同士はどの組み合わせでも 2 ホップで届く</text>

  <!-- legend -->
  <g>
    <line x1="40" y1="106" x2="72" y2="106" stroke="#94a3b8" stroke-width="3"/>
    <text class="legend" x="80" y="111">ファブリックリンク（全 Leaf × 全 Spine のフルメッシュ）</text>
    <line x1="460" y1="106" x2="492" y2="106" stroke="#ff9200" stroke-width="6" stroke-linecap="round"/>
    <text class="legend" x="500" y="111">サーバ A → サーバ B の通信経路の例（Leaf → Spine → Leaf の 2 ホップ）</text>
  </g>

  <!-- ============ links (drawn first, icons on top) ============ -->
  <!-- full mesh: Leaf1/2/3 x Spine1/2 -->
  <line class="link" x1="240" y1="450" x2="420" y2="230"/>
  <line class="link" x1="240" y1="450" x2="780" y2="230"/>
  <line class="link" x1="600" y1="450" x2="420" y2="230"/>
  <line class="link" x1="600" y1="450" x2="780" y2="230"/>
  <line class="link" x1="960" y1="450" x2="420" y2="230"/>
  <line class="link" x1="960" y1="450" x2="780" y2="230"/>

  <!-- highlighted 2-hop path: Leaf1 -> Spine1 -> Leaf3 -->
  <line class="path" x1="240" y1="450" x2="420" y2="230"/>
  <line class="path" x1="420" y1="230" x2="960" y2="450"/>

  <!-- hop labels -->
  <text class="hop" x="268" y="330">① 1 ホップ目</text>
  <text class="hop" x="720" y="330">② 2 ホップ目</text>

  <!-- server links -->
  <line class="link" x1="240" y1="450" x2="240" y2="590"/>
  <line class="link" x1="960" y1="450" x2="960" y2="590"/>

  <!-- ============ row labels ============ -->
  <text class="rowlabel" x="40" y="236">Spine（基幹）</text>
  <text class="rowlabel" x="40" y="456">Leaf（アクセス）</text>

  <!-- ============ devices ============ -->
  <text class="devname" x="420" y="180">Spine1</text>
  <use href="#spinesw" x="420" y="230"/>
  <text class="devname" x="780" y="180">Spine2</text>
  <use href="#spinesw" x="780" y="230"/>

  <text class="devname" x="240" y="516">Leaf1</text>
  <use href="#leafsw" x="240" y="450"/>
  <text class="devname" x="600" y="516">Leaf2</text>
  <use href="#leafsw" x="600" y="450"/>
  <text class="devname" x="960" y="516">Leaf3</text>
  <use href="#leafsw" x="960" y="450"/>

  <use href="#pc" x="240" y="590"/>
  <text class="devname" x="240" y="648">サーバ A</text>
  <use href="#pc" x="960" y="590"/>
  <text class="devname" x="960" y="648">サーバ B</text>

  <text class="note" x="600" y="620">サーバ A → サーバ B（East-West 通信）は Spine1 経由でも Spine2 経由でも同じ 2 ホップ</text>

  <!-- summary note box -->
  <rect x="40" y="672" width="1120" height="66" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="60" y="698" font-size="14">🎯 どの Leaf 同士の通信も Leaf → Spine → Leaf の 2 ホップで等距離 → 遅延が予測しやすく、渋滞しにくい（ノンブロッキング）</text>
  <text x="60" y="722" font-size="14">Leaf を増やすときは全 Spine とつなぐだけでよく拡張しやすい（※同一 Leaf 配下のサーバ同士は Spine を経由しない）</text>
</svg>
